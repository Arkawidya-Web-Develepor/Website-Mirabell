<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="c1w-navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="c1w-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <linearGradient id="c1w-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C076" />
      <stop offset="50%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>

    <filter id="c1w-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- LOGOMARK CONTAINER -->
  <g transform="translate(10, 10)" filter="url(#c1w-glow)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#c1w-navy-grad)" />
    <rect x="1.5" y="1.5" width="97" height="97" rx="24.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4" />

    <!-- Wings of M -->
    <path d="M26 68 L26 38 C26 34 29 31 33 33 L46 44 C48 45.5 49 48 49 51 L49 68 C49 70 47 72 45 72 L30 72 C27.8 72 26 70.2 26 68 Z" fill="url(#c1w-teal-grad)" />
    <path d="M74 68 L74 38 C74 34 71 31 67 33 L54 44 C52 45.5 51 48 51 51 L51 68 C51 70 53 72 55 72 L70 72 C72.2 72 74 70.2 74 68 Z" fill="url(#c1w-teal-grad)" />

    <!-- Center Medical Cross -->
    <path d="M46 26 C46 24 47.8 22 50 22 C52.2 22 54 24 54 26 L54 58 C54 60.2 52.2 62 50 62 C47.8 62 46 60.2 46 58 Z" fill="#FFFFFF" />
    <path d="M36 36 C34 36 32 37.8 32 40 C32 42.2 34 44 36 44 L64 44 C66 44 68 42.2 68 40 C68 37.8 66 36 64 36 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Gold Core Star -->
    <circle cx="50" cy="40" r="4.5" fill="url(#c1w-gold-grad)" />
    <circle cx="50" cy="40" r="2" fill="#FFFFFF" />
  </g>

  <!-- LOGOTYPE -->
  <g transform="translate(130, 20)">
    <text x="0" y="46" font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="3.5" fill="#FFFFFF">
      MIRA<tspan fill="#38BDF8">BELL</tspan>
    </text>

    <rect x="0" y="58" width="58" height="3" rx="1.5" fill="url(#c1w-gold-grad)" />
    <rect x="66" y="59" width="310" height="1" fill="rgba(255,255,255,0.2)" />

    <text x="0" y="78" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#2DD4BF">
      KLINIK UTAMA &amp; LAYANAN MEDIS TERPADU
    </text>

    <text x="0" y="93" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#94A3B8">
      BALIKPAPAN &bull; LAYANAN 24 JAM &bull; MITRA MIGAS &amp; KELUARGA
    </text>
  </g>
</svg>
