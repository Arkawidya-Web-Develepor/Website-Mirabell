<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mk-navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1B28" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>

    <linearGradient id="mk-teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="mk-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C076" />
      <stop offset="50%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>

    <filter id="mk-soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0A1B28" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(10, 10)" filter="url(#mk-soft-shadow)">
    <!-- Squircle Canvas -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#mk-navy-grad)" />
    <rect x="1.5" y="1.5" width="97" height="97" rx="24.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

    <!-- Outer Precision Orbit Ring -->
    <circle cx="50" cy="50" r="41" fill="none" stroke="url(#mk-teal-grad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />

    <!-- Left Wing of M -->
    <path d="M26 68 L26 38 C26 34 29 31 33 33 L46 44 C48 45.5 49 48 49 51 L49 68 C49 70 47 72 45 72 L30 72 C27.8 72 26 70.2 26 68 Z" fill="url(#mk-teal-grad)" />
    
    <!-- Right Wing of M -->
    <path d="M74 68 L74 38 C74 34 71 31 67 33 L54 44 C52 45.5 51 48 51 51 L51 68 C51 70 53 72 55 72 L70 72 C72.2 72 74 70.2 74 68 Z" fill="url(#mk-teal-grad)" />

    <!-- Center Medical Cross Pillar -->
    <path d="M46 26 C46 24 47.8 22 50 22 C52.2 22 54 24 54 26 L54 58 C54 60.2 52.2 62 50 62 C47.8 62 46 60.2 46 58 Z" fill="#FFFFFF" />
    <path d="M36 36 C34 36 32 37.8 32 40 C32 42.2 34 44 36 44 L64 44 C66 44 68 42.2 68 40 C68 37.8 66 36 64 36 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Central Gold Vitality Core Star -->
    <circle cx="50" cy="40" r="4.5" fill="url(#mk-gold-grad)" />
    <circle cx="50" cy="40" r="2" fill="#FFFFFF" />
  </g>
</svg>
